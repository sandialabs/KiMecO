name: Tests

# Runs the unit test suite on every push and pull request so failures are
# caught before code is merged. Only tests/unit/ is run here because tests
# that depend on the external MESS binary cannot run in vanilla CI.

on:
  push:
  pull_request:

# Cancel an in-progress run if a newer commit is pushed to the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run unit tests
        run: pytest tests/unit/ -v

      # Opt-in installation test: performs a real editable install in a fresh
      # venv and checks imports, console scripts and packaging metadata.
      - name: Run editable-install test
        run: KIMECO_RUN_INSTALL_TEST=1 pytest tests/unit/test_installation_imports_ci.py -q -k editable_install

  # Proves that the automech extra is installable and importable, not just
  # declared: autoio/autochem are not on PyPI so they are pre-installed from
  # GitHub (same pins as README / MANUAL / wiki), then `.[automech,test]` is
  # installed and KIMECO_REQUIRE_EXTRAS turns every "extra not installed"
  # skip in tests/unit/ into a failure.
  test-automech-extra:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      KIMECO_REQUIRE_EXTRAS: automech,test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Pre-install autoio and autochem from GitHub (not on PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install "autoio @ git+https://github.com/Auto-Mech/autoio@0.2026.0" "autochem @ git+https://github.com/Auto-Mech/autochem@0.2026.3"

      - name: Install package with automech and test extras
        run: pip install -e .[automech,test]

      - name: Verify the documented automech imports
        run: python -c "import mess_io, phydat, kimeco"

      - name: Run unit tests with the automech extra required
        run: pytest tests/unit/ -v
