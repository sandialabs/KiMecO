# Base Cantera mechanism of tests/unit/test_kinmec_prompt_ci.py: every
# species of the H-group prompt SOP (tests/unit/data/c4h8_h_group/, hot C4H7
# PES + H_C4H71-3, H_C4H71-4, 2-H_C4H71-3), the four AutoMech fake wells
# included, so KiMec.add_species adds nothing, plus AR. One shared NASA7
# (argon coefficients): the thermo is never used by the tests (rates only).
#
# Base reactions (KiMec.find_redundant_idx: a new thermal reaction replaces
# a base reaction with the same Cantera reactants and products, a prompt
# reaction one with the same species, explicit collider included):
#   r0, r3: the thermal forward / MESS reverse of the PES 1 PED pair
#           (duplicate: Cantera pairs a reversible reaction with the
#           reverse of another one);
#   r1: unrelated, kept in every mode;
#   r2: same species as a 3-product prompt reaction only;
#   r4: same Cantera species dicts as the 3-product prompt reaction
#       CH2CHCH2CH3 + H => H2 + CH2CHCHCH2 + H, which Cantera reads as a
#       three-body reaction with collider H (reactants/products omit H),
#       but a different reaction: kept in every mode.
units: {length: cm, quantity: mol, activation-energy: cal/mol}

phases:
- name: gas
  thermo: ideal-gas
  elements: [C, H, Ar]
  species: [AR, H, H2, CH2CHCH2CH3, CH3CHCHCH3, CH2CHCHCH3, CH2CH2CHCH2,
    CH2CHCHCH2, CH2CH2, CH2CH, FakeW-CH2CHCH2CH3+H, FakeW-CH3CHCHCH3+H,
    FakeW-CH2CHCHCH3+H2, FakeW-CH2CH2CHCH2+H2]
  kinetics: gas
  state: {T: 300.0, P: 1 atm}

species:
- name: AR
  composition: {Ar: 1}
  thermo: &thermo
    model: NASA7
    temperature-ranges: [200.0, 1000.0, 6000.0]
    data:
    - [2.5, 0.0, 0.0, 0.0, 0.0, -745.375, 4.366]
    - [2.5, 0.0, 0.0, 0.0, 0.0, -745.375, 4.366]
- name: H
  composition: {H: 1}
  thermo: *thermo
- name: H2
  composition: {H: 2}
  thermo: *thermo
- name: CH2CHCH2CH3
  composition: {C: 4, H: 8}
  thermo: *thermo
- name: CH3CHCHCH3
  composition: {C: 4, H: 8}
  thermo: *thermo
- name: CH2CHCHCH3
  composition: {C: 4, H: 7}
  thermo: *thermo
- name: CH2CH2CHCH2
  composition: {C: 4, H: 7}
  thermo: *thermo
- name: CH2CHCHCH2
  composition: {C: 4, H: 6}
  thermo: *thermo
- name: CH2CH2
  composition: {C: 2, H: 4}
  thermo: *thermo
- name: CH2CH
  composition: {C: 2, H: 3}
  thermo: *thermo
- name: FakeW-CH2CHCH2CH3+H
  composition: {C: 4, H: 9}
  thermo: *thermo
- name: FakeW-CH3CHCHCH3+H
  composition: {C: 4, H: 9}
  thermo: *thermo
- name: FakeW-CH2CHCHCH3+H2
  composition: {C: 4, H: 9}
  thermo: *thermo
- name: FakeW-CH2CH2CHCH2+H2
  composition: {C: 4, H: 9}
  thermo: *thermo

reactions:
- equation: CH2CHCH2CH3 + H <=> CH2CHCHCH3 + H2  # r0
  rate-constant: {A: 1.0e+13, b: 0.0, Ea: 3000.0}
  duplicate: true
- equation: CH2CH2 + H <=> CH2CH + H2  # r1
  rate-constant: {A: 2.0e+13, b: 0.0, Ea: 4000.0}
- equation: CH2CHCH2CH3 + H => H2 + CH2CH2 + CH2CH  # r2
  rate-constant: {A: 3.0e+13, b: 0.0, Ea: 5000.0}
- equation: CH2CHCHCH3 + H2 => CH2CHCH2CH3 + H  # r3
  rate-constant: {A: 4.0e+12, b: 0.0, Ea: 6000.0}
  duplicate: true
- equation: CH2CHCH2CH3 => H2 + CH2CHCHCH2  # r4
  rate-constant: {A: 5.0e+12, b: 0.0, Ea: 60000.0}
